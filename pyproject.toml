[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mon-security-fabric"
version = "0.1.0"
description = "MON Security Fabric control-plane foundation"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "alembic>=1.16,<2",
  "cryptography>=45,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
mon-site = "mon.site_service:main"
mon-sensor-ingress = "mon.sensor_transport:main"
mon-zeek-collector = "mon.sensor_collector:zeek_main"
mon-suricata-collector = "mon.sensor_collector:suricata_main"\nmon-connector-secret = "mon.connector_secrets:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
