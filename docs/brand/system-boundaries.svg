<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="480" viewBox="0 0 1260 480" role="img" aria-labelledby="title desc"><title id="title">SERRATE lab and security fabric architecture</title><desc id="desc">Conceptual red team and blue team lab with monitored victim, network and endpoint sensors, autonomous site controller and SaaS control plane. No live telemetry is shown.</desc>
<rect width="1260" height="480" rx="12" fill="#101b24"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="40" fill="#eff4f4" font-size="23" font-weight="700">ISOLATED EXERCISE / DISTRIBUTED SECURITY FABRIC</text><text x="35" y="67" fill="#a7bdc8" font-size="13">Conceptual responsibilities — implementation and certification coverage are documented separately.</text></g>
<g stroke-width="2"><rect x="30" y="110" width="235" height="265" rx="12" fill="#301f26" stroke="#cc6d67"/><rect x="290" y="110" width="235" height="265" rx="12" fill="#192a33" stroke="#5f99b6"/><rect x="550" y="110" width="315" height="265" rx="12" fill="#1a313e" stroke="#eb986f"/><rect x="890" y="110" width="340" height="265" rx="12" fill="#1a303b" stroke="#6191a9"/></g>
<g font-family="Arial,Helvetica,sans-serif">
<text x="50" y="149" fill="#f2a49a" font-size="20" font-weight="700">RED TEAM</text><text x="50" y="179" fill="#d7e1e4" font-size="14">Authorized adversary</text><text x="50" y="200" fill="#d7e1e4" font-size="14">simulation</text><path d="M50 217H245" stroke="#a85454"/>
<text x="50" y="253" fill="#e8c1bd" font-size="14">• Isolated attack host</text><text x="50" y="281" fill="#e8c1bd" font-size="14">• Approved scenarios</text><text x="50" y="309" fill="#e8c1bd" font-size="14">• Scope + stop rules</text>
<text x="310" y="149" fill="#a8d8ef" font-size="20" font-weight="700">TARGET / SENSORS</text><text x="310" y="179" fill="#d7e1e4" font-size="14">Victim + network lab</text><path d="M310 217H505" stroke="#528cab"/>
<text x="310" y="253" fill="#c8e1eb" font-size="14">• Zeek / Suricata</text><text x="310" y="281" fill="#c8e1eb" font-size="14">• Linux / Windows</text><text x="310" y="309" fill="#c8e1eb" font-size="14">• Grounded evidence</text>
<text x="570" y="149" fill="#f5ba91" font-size="20" font-weight="700">SITE CONTROLLER</text><text x="570" y="179" fill="#d7e1e4" font-size="14">Local autonomy / buffer</text><path d="M570 217H845" stroke="#dc9470"/>
<text x="570" y="253" fill="#f1d3bb" font-size="14">• Detect → correlate → trace</text><text x="570" y="281" fill="#f1d3bb" font-size="14">• Policy / adapter selection</text><text x="570" y="309" fill="#f1d3bb" font-size="14">• TTL rollback + recovery</text>
<text x="910" y="149" fill="#b2d6e8" font-size="20" font-weight="700">CONTROL PLANE</text><text x="910" y="179" fill="#d7e1e4" font-size="14">Tenants / sites / operators</text><path d="M910 217H1210" stroke="#528cab"/>
<text x="910" y="253" fill="#c8e1eb" font-size="14">• Incidents + RBAC</text><text x="910" y="281" fill="#c8e1eb" font-size="14">• Policies + fleet</text><text x="910" y="309" fill="#c8e1eb" font-size="14">• Audit + reporting</text>
</g>
<path d="M269 230h19m239 0h21m319 0h21" stroke="#f0a27d" stroke-width="5"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="34" y="416" fill="#ecbba7" font-size="14" font-weight="700">ATTACK GENERATION IS SEPARATE FROM DETECTION AND ENFORCEMENT</text><text x="34" y="444" fill="#a9c2cf" font-size="14">Local protection and rollback continue when the cloud link is unavailable; upstream mitigation requires a real integration.</text></g>
</svg>