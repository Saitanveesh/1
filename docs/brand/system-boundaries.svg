<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title description">
<title id="title">RIFTWARD distributed system responsibility boundaries</title>
<desc id="description">Architecture diagram showing telemetry sources, local Site Controller, independently continuing local response and recovery, authenticated site-to-cloud link, and SaaS Control Plane. Vendor integrations beyond current code remain targets, not certified features.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091824"/><stop offset="1" stop-color="#132d3b"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7z" fill="#f0a36b"/></marker><marker id="bl" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7z" fill="#7db6ca"/></marker></defs>
<rect width="1400" height="700" rx="18" fill="url(#bg)"/>
<g font-family="Inter,Arial,Helvetica,sans-serif">
<text x="54" y="52" fill="#f5f7f5" font-size="26" font-weight="800">Distributed by design. Local when it matters.</text>
<text x="54" y="78" fill="#a8c2ce" font-size="14">Conceptual responsibilities; consult readiness evidence before interpreting a connector as certified.</text>
</g>
<rect x="53" y="125" width="354" height="418" rx="17" fill="#102839" stroke="#42718b" stroke-width="2"/>
<rect x="465" y="125" width="456" height="418" rx="17" fill="#163345" stroke="#f0a36b" stroke-width="2"/>
