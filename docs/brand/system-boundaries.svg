<text x="76" y="164" fill="#f7f8f5" font-size="22" font-weight="700">OBSERVE</text>
<text x="76" y="187" fill="#97b6c6" font-size="13">SENSORS + TELEMETRY</text>
<text x="489" y="164" fill="#f7f8f5" font-size="22" font-weight="700">ACT LOCALLY</text>
<text x="489" y="187" fill="#f7af80" font-size="13">SITE CONTROLLER / LOCAL AUTONOMY</text>
<text x="1003" y="164" fill="#f7f8f5" font-size="22" font-weight="700">COORDINATE</text>
<text x="1003" y="187" fill="#97b6c6" font-size="13">MULTI-TENANT CONTROL PLANE</text>
</g>
<g fill="#183a4c" stroke="#426d81">
<rect x="75" y="224" width="308" height="64" rx="10"/>
