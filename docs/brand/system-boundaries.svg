<g font-family="Inter,Arial,Helvetica,sans-serif">
<text x="487" y="590" fill="#ffca9d" font-size="17" font-weight="700">Offline boundary</text>
<text x="487" y="614" fill="#d9c5b5" font-size="13">No cloud link? Local buffering, policy and recovery continue.</text>
<text x="53" y="664" fill="#a6bfcc" font-size="13">Network appliance / cloud / NAC enforcement remains adapter- and environment-dependent.</text>
</g>
