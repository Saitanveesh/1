<rect x="1003" y="390" width="318" height="64" rx="10"/>
</g>
<g font-family="Inter,Arial,Helvetica,sans-serif">
<text x="96" y="249" fill="#fff" font-size="17" font-weight="700">Network telemetry</text>
<text x="96" y="271" fill="#a4c2cf" font-size="12">Zeek, Suricata, flow sources</text>
<text x="96" y="332" fill="#fff" font-size="17" font-weight="700">Endpoint evidence</text>
<text x="96" y="354" fill="#a4c2cf" font-size="12">Linux and Windows collectors</text>
<text x="96" y="415" fill="#fff" font-size="17" font-weight="700">Site and infrastructure context</text>
<text x="96" y="437" fill="#a4c2cf" font-size="12">Asset, identity, network relationships</text>
<text x="510" y="249" fill="#fff" font-size="17" font-weight="700">Buffer + normalize + correlate</text>
<text x="510" y="271" fill="#a4c2cf" font-size="12">Durable local evidence and offline operation</text>
<text x="510" y="332" fill="#fff" font-size="17" font-weight="700">Policy + enforcement decision</text>
<text x="510" y="354" fill="#a4c2cf" font-size="12">Evidence, capability, TTL and scope checks</text>
<text x="510" y="415" fill="#fff" font-size="17" font-weight="700">Apply + verify + recover</text>
<text x="510" y="437" fill="#a4c2cf" font-size="12">Certified adapter coverage is limited</text>
<text x="1024" y="249" fill="#fff" font-size="17" font-weight="700">Tenants, sites and RBAC</text>
<text x="1024" y="271" fill="#a4c2cf" font-size="12">Scoped identities and authorization</text>
<text x="1024" y="332" fill="#fff" font-size="17" font-weight="700">Incidents, policy, fleet</text>
<text x="1024" y="354" fill="#a4c2cf" font-size="12">Control and operator workflows</text>
<text x="1024" y="415" fill="#fff" font-size="17" font-weight="700">Audit and reporting</text>
<text x="1024" y="437" fill="#a4c2cf" font-size="12">Evidence-backed decision record</text>
</g>
