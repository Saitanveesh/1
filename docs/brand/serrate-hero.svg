<title id="title">SERRATE — Network Security and Adversary Simulation Lab</title><desc id="desc">Original hand-authored vector diagram. Seven cut-edge teeth represent Discover, Detect, Correlate, Trace, Contain, Verify, Recover, with separated red and blue simulation lanes. No generated photos, dashboard metrics, or fake telemetry.</desc>
