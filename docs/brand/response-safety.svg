<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="455" viewBox="0 0 1360 455" role="img" aria-labelledby="title description">
<title id="title">Policy-gated containment and reversible response</title>
<desc id="description">A response proposal passes evidence, scope, policy and enforcement capability gates. Approval can be required. Application is followed by verification, audit and TTL-based rollback/recovery. Denials stop the process.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1b28"/><stop offset="1" stop-color="#0c2935"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7z" fill="#f4a772"/></marker></defs>
<rect width="1360" height="455" rx="16" fill="url(#bg)"/>
<g font-family="Inter,Arial,Helvetica,sans-serif">
<text x="45" y="48" font-size="25" font-weight="700" fill="#f7f7f5">Containment is a controlled transaction</text>
<text x="45" y="76" font-size="14" fill="#aac3ce">Policy first. Measure the blast radius. Verify the action. Preserve a rollback path.</text>
</g>
<g stroke-width="2" stroke-linejoin="round">
<rect x="44" y="144" width="207" height="104" rx="12" fill="#163243" stroke="#44738a"/>
<rect x="291" y="144" width="207" height="104" rx="12" fill="#163243" stroke="#44738a"/>
<rect x="538" y="144" width="207" height="104" rx="12" fill="#382d2c" stroke="#efa06e"/>
<rect x="785" y="144" width="207" height="104" rx="12" fill="#163243" stroke="#44738a"/>
<rect x="1032" y="144" width="278" height="104" rx="12" fill="#163243" stroke="#44738a"/>
</g>
<g font-family="Inter,Arial,Helvetica,sans-serif">
<text x="63" y="175" font-size="13" fill="#f4a36e" font-weight="700">INPUT</text><text x="63" y="204" font-size="19" fill="#f7f7f5" font-weight="700">Incident evidence</text><text x="63" y="225" font-size="12" fill="#a6c3cf">Source + confidence</text>
<text x="310" y="175" font-size="13" fill="#f4a36e" font-weight="700">DECISION</text><text x="310" y="204" font-size="19" fill="#f7f7f5" font-weight="700">Scope + policy</text><text x="310" y="225" font-size="12" fill="#a6c3cf">Asset criticality + approval</text>
<text x="557" y="175" font-size="13" fill="#ffc092" font-weight="700">SAFETY GATE</text><text x="557" y="204" font-size="19" fill="#f7f7f5" font-weight="700">Enforcement point</text><text x="557" y="225" font-size="12" fill="#d8b9a6">Capability + blast radius + TTL</text>
<text x="804" y="175" font-size="13" fill="#f4a36e" font-weight="700">EXECUTE</text><text x="804" y="204" font-size="19" fill="#f7f7f5" font-weight="700">Apply + verify</text><text x="804" y="225" font-size="12" fill="#a6c3cf">Record actual outcome</text>
<text x="1051" y="175" font-size="13" fill="#f4a36e" font-weight="700">RESTORE</text><text x="1051" y="204" font-size="19" fill="#f7f7f5" font-weight="700">Rollback + recovery</text><text x="1051" y="225" font-size="12" fill="#a6c3cf">TTL, audit, service health</text>
</g>
<g fill="none" stroke="#f4a772" stroke-width="2.5" marker-end="url(#a)"><path d="M254 196H283"/><path d="M501 196H530"/><path d="M748 196H777"/><path d="M995 196H1024"/></g>
<g fill="none" stroke="#f4a772" stroke-width="2" stroke-dasharray="7 6"><path d="M393 248V309H659"/><path d="M642 248V309"/><path d="M887 248V309H671"/></g>
<rect x="527" y="307" width="286" height="59" rx="10" fill="#291d24" stroke="#a95d5c"/>
<text x="670" y="332" fill="#ffc9be" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">DENY / ESCALATE</text>
<text x="670" y="352" fill="#d6afb0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">Insufficient evidence or unsafe scope</text>
<g font-family="Inter,Arial,Helvetica,sans-serif"><text x="45" y="417" fill="#9ebbc7" font-size="13">No permanent critical-asset isolation from a weak single detector. No success claim without verified enforcement.</text></g>
</svg>