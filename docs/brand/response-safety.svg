<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 0 1240 300" role="img" aria-labelledby="title desc"><title id="title">SERRATE reversible containment decision flow</title><desc id="desc">Proposed actions require evidence and policy checks, capable enforcement, and verification with audit and rollback. Unsafe actions are denied.</desc><rect width="1240" height="300" rx="12" fill="#101b24"/>
<text x="32" y="43" fill="#f2f4f5" font-family="Arial" font-size="22" font-weight="700">SAFE RESPONSE / EXPLICIT ROLLBACK</text><text x="32" y="67" fill="#9bb5c1" font-family="Arial" font-size="14">Containment is not a permanent, automated reaction to a single weak alert.</text>
<g fill="#1b3342" stroke="#6c94a8" stroke-width="1.5"><rect x="30" y="110" width="212" height="85" rx="8"/><rect x="278" y="110" width="212" height="85" rx="8"/><rect x="526" y="110" width="212" height="85" rx="8"/><rect x="774" y="110" width="212" height="85" rx="8"/><rect x="1022" y="110" width="187" height="85" rx="8"/></g>
<g font-family="Arial" font-size="15" fill="#f2f4f5" text-anchor="middle"><text x="136" y="143">Evidence</text><text x="136" y="168" font-size="12" fill="#a8bfca">Source + confidence</text><text x="384" y="143">Policy gate</text><text x="384" y="168" font-size="12" fill="#a8bfca">Scope + approval</text><text x="632" y="143">Choose adapter</text><text x="632" y="168" font-size="12" fill="#a8bfca">Capability + blast radius</text><text x="880" y="143">Apply + verify</text><text x="880" y="168" font-size="12" fill="#a8bfca">Audit actual result</text><text x="1115" y="143">Recover</text><text x="1115" y="168" font-size="12" fill="#a8bfca">TTL + rollback</text></g>
<path d="M244 151h32m216 0h32m216 0h32m216 0h32" stroke="#f09d79" stroke-width="3"/>
<path d="M385 198v40h248v-40" fill="none" stroke="#dc7a75" stroke-dasharray="5 5" stroke-width="2"/><text x="510" y="263" text-anchor="middle" font-family="Arial" fill="#e59c98" font-size="14">Deny / escalate when unsafe or unsupported</text>
</svg>