<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="245" viewBox="0 0 1400 245" role="img" aria-labelledby="title desc"><title id="title">SERRATE evidence-to-recovery workflow</title><desc id="desc">Seven stages: Discover, Detect, Correlate, Trace, Contain, Verify, Recover. Response remains evidence- and policy-gated.</desc>
<rect width="1400" height="245" rx="12" fill="#101b24"/><text x="35" y="40" fill="#e7eff1" font-family="Arial" font-weight="700" font-size="20">FROM LAB ACTIVITY TO VERIFIED RECOVERY</text><text x="35" y="62" fill="#91aab8" font-family="Arial" font-size="13">No fake evidence. No unapproved containment. No success claims without verification.</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="23" y="92" width="177" height="99" rx="8" fill="#1e3543" stroke="#5f8799"/><text x="111" y="121" fill="#e58c72" font-size="12">01  /  OBSERVE</text><text x="111" y="151" fill="#fff" font-size="18" font-weight="700">DISCOVER</text><text x="111" y="175" fill="#a7c2d0" font-size="11">Assets, sources</text>
<rect x="222" y="92" width="177" height="99" rx="8" fill="#1e3543" stroke="#5f8799"/><text x="310" y="121" fill="#e58c72" font-size="12">02  /  SIGNAL</text><text x="310" y="151" fill="#fff" font-size="18" font-weight="700">DETECT</text><text x="310" y="175" fill="#a7c2d0" font-size="11">Observed events</text>
<rect x="421" y="92" width="177" height="99" rx="8" fill="#1e3543" stroke="#5f8799"/><text x="509" y="121" fill="#e58c72" font-size="12">03  /  CONTEXT</text><text x="509" y="151" fill="#fff" font-size="18" font-weight="700">CORRELATE</text><text x="509" y="175" fill="#a7c2d0" font-size="11">Cross-source evidence</text>
<rect x="620" y="92" width="177" height="99" rx="8" fill="#1e3543" stroke="#5f8799"/><text x="708" y="121" fill="#e58c72" font-size="12">04  /  PATH</text><text x="708" y="151" fill="#fff" font-size="18" font-weight="700">TRACE</text><text x="708" y="175" fill="#a7c2d0" font-size="11">Impact and identity</text>
<rect x="819" y="92" width="177" height="99" rx="8" fill="#31282a" stroke="#ed896b" stroke-width="2"/><text x="907" y="121" fill="#f3a28a" font-size="12">05  /  DECIDE</text><text x="907" y="151" fill="#fff" font-size="18" font-weight="700">CONTAIN</text><text x="907" y="175" fill="#e7b7a5" font-size="11">Policy, TTL, scope</text>
<rect x="1018" y="92" width="177" height="99" rx="8" fill="#1e3543" stroke="#5f8799"/><text x="1106" y="121" fill="#e58c72" font-size="12">06  /  CHECK</text><text x="1106" y="151" fill="#fff" font-size="18" font-weight="700">VERIFY</text><text x="1106" y="175" fill="#a7c2d0" font-size="11">Actual outcome</text>
<rect x="1217" y="92" width="160" height="99" rx="8" fill="#1e3543" stroke="#5f8799"/><text x="1297" y="121" fill="#e58c72" font-size="12">07  /  RESTORE</text><text x="1297" y="151" fill="#fff" font-size="18" font-weight="700">RECOVER</text><text x="1297" y="175" fill="#a7c2d0" font-size="11">Rollback + health</text>
</g><g stroke="#ef8e70" stroke-width="2" fill="none"><path d="M202 142h18m181 0h18m181 0h18m181 0h18m181 0h18m181 0h18"/></g><text x="700" y="226" text-anchor="middle" fill="#91b1c3" font-family="Arial" font-size="13">Evidence  •  Confidence  •  Tenant/site scope  •  Approval  •  Blast radius  •  Audit  •  Rollback</text></svg>