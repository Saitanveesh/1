services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mon
      POSTGRES_USER: mon
      POSTGRES_PASSWORD: mon-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mon -d mon"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mon-postgres:/var/lib/postgresql/data

  control-plane:
    build: .
    ports:
      - "8080:8080"
    environment:
      MON_ENV: development
      MON_DATABASE_URL: postgresql+psycopg://mon:mon-dev@postgres:5432/mon
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mon-postgres:
