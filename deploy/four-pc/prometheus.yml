global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: erp-process
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/erp-metrics.json
        refresh_interval: 10s

  - job_name: erp-independent-availability
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/erp-probe.json
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
