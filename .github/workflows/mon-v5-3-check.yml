name: MON V5.3 incident UI verification

on:
  push:
    branches:
      - fix/mon-v5-3-readable-flow-always-on
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React console dependencies
        working-directory: console
        run: npm install --no-audit --no-fund
      - name: Type-check and build UI
        working-directory: console
        run: npm run build
      - name: Test case flow and existing console
        working-directory: console
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify installer syntax and scope
        run: |
          python -m pip install pytest
          pytest -q tests/test_mon_v5_2_investigation_deploy.py tests/test_mon_v5_3_deploy.py
