name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,erp-range,switch]'
          pip check
      - name: Topology, switch and ERP regression
        run: pytest -q tests/test_topology.py tests/test_network_topology.py tests/test_topology_neighbor_collector.py tests/test_topology_inventory.py tests/test_topology_history.py tests/test_topology_snmpv3.py tests/test_range_erp.py tests/test_range_health.py tests/test_range_exercise.py tests/test_range_evidence.py tests/test_range_receipt_upload.py tests/test_arp_conflict_detection.py tests/test_range_lab_arp.py tests/test_range_lab_http.py tests/test_range_lab_ingest.py tests/test_lab_soc_session.py
      - name: PySNMPv3 runtime import smoke
        run: python -c "from pysnmp.hlapi.v3arch.asyncio import bulk_walk_cmd, USM_AUTH_HMAC192_SHA256, USM_PRIV_CFB128_AES; assert bulk_walk_cmd"
      - name: Read-only topology collector CLI smoke
        run: mon-topology-collect --help
      - name: Read-only SNMPv3 collector CLI smoke
        run: mon-switch-snmpv3 --help
      - name: Isolated ERP exercise CLI smoke
        run: mon-range-exercise --help
      - name: Scoped exercise evidence uploader CLI smoke
        run: mon-range-upload --help
      - name: Validate isolated netns harness shell and Python entrypoints
        run: |
          bash -n tools/range_lab/run.sh tools/range_lab/preflight.sh tools/lab_soc_init.sh
          # The hosted runner is not a disconnected single-interface VM.
          # A successful preflight on CI would mean the safety gate is broken.
          if sudo env MON_DISPOSABLE_VM_CONFIRMED=YES \
              bash tools/range_lab/preflight.sh > /tmp/mon-range-preflight.log 2>&1; then
            echo "Unsafe: disconnected-VM preflight unexpectedly passed CI runner"
            exit 1
          fi
          cat /tmp/mon-range-preflight.log
          python -m compileall -q tools/range_lab
          python tools/range_lab/load.py --help
          python tools/range_lab/analyze_arp.py --help
          python tools/range_lab/analyze_http.py --help
          python -m tools.range_lab.ingest --help
      - name: Lint
        run: |
          ruff check --diff tests/test_topology.py || true
          ruff check .
      - name: Test
        run: pytest -q

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -t mon-control-plane:test .
      - name: Build isolated synthetic ERP service image
        run: docker build -t mon-synthetic-erp:test demo/erp_range
      - name: Build SOC operator console image
        run: docker build -f deploy/four-pc/console/Dockerfile -t mon-console:test .
      - name: Validate four-PC Compose manifests without starting a service
        env:
          MON_DB_PASSWORD: test-only-not-for-production
          MON_DATABASE_URL: postgresql+psycopg://mon:test-only-not-for-production@postgres:5432/mon
          MON_AUTH_ISSUER: https://test-issuer.invalid
          MON_AUTH_AUDIENCE: mon-ci
          ERP_DB_PASSWORD: test-only-not-for-production
          ERP_DATABASE_URL: postgresql://mon_erp_range:test-only-not-for-production@erp-db:5432/mon_erp_range
          ERP_BIND_IP: 192.0.2.10
          ERP_MONITOR_BIND_IP: 192.0.2.11
        run: |
          docker compose -f deploy/four-pc/compose.soc.yml config -q
          docker compose -f deploy/four-pc/compose.erp.yml config -q
      - name: Integration — real synthetic ERP with disposable PostgreSQL
        env:
          ERP_DB_PASSWORD: github-actions-test-only-secret
          ERP_DATABASE_URL: postgresql://mon_erp_range:github-actions-test-only-secret@erp-db:5432/mon_erp_range
          ERP_BIND_IP: 127.0.0.1
          ERP_MONITOR_BIND_IP: 127.0.0.1
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -f deploy/four-pc/compose.erp.yml down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose -f deploy/four-pc/compose.erp.yml up -d --build --wait
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8081/health/ready > /tmp/erp-ready.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker compose -f deploy/four-pc/compose.erp.yml logs --tail=80 erp-db erp-app
            exit 1
          fi
          python - <<'PY'
          import json, urllib.request
          with open('/tmp/erp-ready.json', encoding='utf-8') as handle:
              ready = json.load(handle)
          assert ready['state'] == 'READY'
          assert ready['database'] == 'RESPONDING'
          assert ready['synthetic_records'] == '250'
          with urllib.request.urlopen('http://127.0.0.1:8081/api/students?limit=4') as response:
              payload = json.load(response)
          assert payload['dataset'] == 'FICTIONAL / GENERATED TEST RECORDS'
          assert len(payload['records']) == 4
          assert all(row['code'].startswith('DEMO-') for row in payload['records'])
          with urllib.request.urlopen('http://127.0.0.1:8081/metrics') as response:
              metrics = response.read().decode('utf-8')
          assert 'mon_erp_process_rss_bytes' in metrics
          assert 'mon_erp_http_requests_total' in metrics
          with urllib.request.urlopen('http://127.0.0.1:9100/metrics') as response:
              host_metrics = response.read().decode('utf-8')
          assert 'node_cpu_seconds_total' in host_metrics
          assert 'node_memory_MemAvailable_bytes' in host_metrics
          PY

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mon_test
          POSTGRES_USER: mon
          POSTGRES_PASSWORD: mon-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mon -d mon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MON_DATABASE_URL: postgresql+psycopg://mon:mon-test@127.0.0.1:5432/mon_test
      MON_TEST_DATABASE_URL: postgresql+psycopg://mon:mon-test@127.0.0.1:5432/mon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: Create non-bypass application database role
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://mon:mon-test@127.0.0.1:5432/mon_test"
          ) as connection:
              connection.execute(
                  "CREATE ROLE mon_app_ci LOGIN PASSWORD 'mon-app-ci-test' "
                  "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
              connection.execute("GRANT CONNECT ON DATABASE mon_test TO mon_app_ci")
              connection.execute("GRANT USAGE ON SCHEMA public TO mon_app_ci")
              connection.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO mon_app_ci"
              )
              connection.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO mon_app_ci"
              )
          PY
          echo "MON_TEST_DATABASE_URL=postgresql+psycopg://mon_app_ci:mon-app-ci-test@127.0.0.1:5432/mon_test" >> "$GITHUB_ENV"
      - name: PostgreSQL integration tests
        run: pytest -q tests/test_postgres_integration.py

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: console/package.json
      - name: Install console dependencies
        run: npm install --no-audit --no-fund
      - name: Check cinematic demo JavaScript
        run: node --check ../demo/mon_cinematic/simulation.js
      - name: Test console
        run: npm test
      - name: Build console
        run: npm run build

  windows-endpoint-collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install "pyinstaller>=6.10,<7"
      - name: Windows collector tests
        run: pytest -q tests/test_windows_endpoint_collector.py
      - name: Collector CLI smoke
        run: mon-windows-endpoint-collector --help
      - name: Service host import and foreground runtime smoke
        run: |
          mon-windows-endpoint-collector foreground --help
          python -c "from mon.windows_endpoint_collector import NativeWindowsServiceControlBoundary, WindowsCollectorServiceRuntime; NativeWindowsServiceControlBoundary(); assert WindowsCollectorServiceRuntime"
      - name: Disposable SCM lifecycle validation
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name MONWindows `
            --collect-all mon `
            -c src/mon/windows_endpoint_collector.py
          $serviceName = "MONWindowsCI-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $stateDir = Join-Path $env:RUNNER_TEMP $serviceName
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $exe = (Resolve-Path ".\dist\MONWindows.exe").Path
          try {
            tools\windows\mon-windows-service.ps1 install -ServiceName $serviceName -ExecutablePath $exe -StateDir $stateDir -TenantId ci-tenant -SiteId ci-site -SensorId ci-sensor -SiteUrl http://127.0.0.1:9 -PollIntervalSeconds 1 -TimeoutSeconds 30
            tools\windows\mon-windows-service.ps1 start -ServiceName $serviceName -TimeoutSeconds 30
            tools\windows\mon-windows-service.ps1 status -ServiceName $serviceName
            tools\windows\mon-windows-service.ps1 stop -ServiceName $serviceName -TimeoutSeconds 30
          }
          finally {
            tools\windows\mon-windows-service.ps1 uninstall -ServiceName $serviceName -TimeoutSeconds 30
          }

  linux-endpoint-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Import check
        run: python -c "import mon.linux_endpoint_collector"
      - name: Linux collector tests
        run: pytest -q tests/test_linux_endpoint_collector.py tests/test_linux_endpoint_collector_runtime.py
      - name: Ruff
        run: ruff check src/mon/linux_endpoint_collector.py tests/test_linux_endpoint_collector.py tests/test_linux_endpoint_collector_runtime.py
      - name: CLI --help
        run: mon-linux-endpoint-collector --help
      - name: Foreground runtime and SIGTERM cancellation smoke
        run: |
          set -euo pipefail
          STATE_DIR="$(mktemp -d)"
          mon-linux-endpoint-collector foreground \
            --tenant-id ci-tenant \
            --site-id ci-site \
            --sensor-id ci-sensor \
            --state-dir "$STATE_DIR" \
            --site-url http://127.0.0.1:9 \
            --poll-interval-seconds 5 &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "collector exited before SIGTERM was sent" >&2
            wait "$pid"
            exit 1
          fi
          kill -TERM "$pid"
          if ! wait "$pid"; then
            status=$?
            echo "collector exited $status after SIGTERM (expected 0)" >&2
            exit 1
          fi
        # No privileged host audit access is required or assumed here: on a
        # stock ubuntu-latest runner both native sources report
        # SOURCE_UNAVAILABLE/PERMISSION_DENIED rather than fabricating
        # telemetry, and the process must still start and shut down cleanly.

  isolated-mitm-and-multi-origin-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MON and disposable Linux namespace tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping nftables tcpdump curl
      - name: Real veth-only MITM/pressure packet-path and rollback acceptance
        run: |
          set -euo pipefail
          sudo env MON_DISPOSABLE_VM_CONFIRMED=YES \
            MON_PYTHON="$(command -v python)" \
            bash tools/range_lab/run.sh --scenario all --victim beta
      - name: Alternative victim exercise selection
        run: |
          set -euo pipefail
          sudo env MON_DISPOSABLE_VM_CONFIRMED=YES \
            MON_PYTHON="$(command -v python)" \
            bash tools/range_lab/run.sh --scenario multi-origin --victim alpha

  linux-enforcement-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MON and nftables tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping
      - name: Validate disposable nftables adapter
        run: |
          set -euo pipefail
          NS="mon-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PYTHON="$(command -v python)"
          cleanup() {
            sudo ip netns del "$NS" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo ip netns add "$NS"
          sudo ip netns exec "$NS" ip link set lo up
          sudo -E env \
            MON_ENABLE_DISPOSABLE_NETNS_ENFORCEMENT=1 \
            MON_TEST_NETNS="$NS" \
            "$PYTHON" -m pytest -q tests/test_nftables_netns_integration.py
      - name: Validate router containment on a real forwarded packet path
        run: |
          set -euo pipefail
          NS="mon-sandbox-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PYTHON="$(command -v python)"
          cleanup() {
            sudo ip netns del "$NS" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo ip netns add "$NS"
          sudo ip netns exec "$NS" ip link set lo up
          sudo -E env \
            MON_ENABLE_ROUTER_NFTABLES_ENFORCEMENT=1 \
            MON_TEST_NETNS="$NS" \
            "$PYTHON" -m pytest -q tests/test_nftables_router_integration.py
      - name: Validate Linux endpoint nftables adapter candidate (disposable namespace only)
        run: |
          set -euo pipefail
          NS="mon-sandbox-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PYTHON="$(command -v python)"
          cleanup() {
            sudo ip netns del "$NS" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo ip netns add "$NS"
          sudo ip netns exec "$NS" ip link set lo up
          # This still targets a disposable namespace, never the runner's own
          # host firewall, even though the adapter under test is designed for
          # eventual endpoint-host use. See docs/adr for the certification
          # scope this does and does not prove.
          sudo -E env \
            MON_ENABLE_ENDPOINT_NFTABLES_ENFORCEMENT=1 \
            MON_TEST_NETNS="$NS" \
            "$PYTHON" -m pytest -q tests/test_nftables_endpoint_integration.py
