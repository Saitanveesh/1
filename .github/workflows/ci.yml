name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -t mon-control-plane:test .

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mon_test
          POSTGRES_USER: mon
          POSTGRES_PASSWORD: mon-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mon -d mon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MON_DATABASE_URL: postgresql+psycopg://mon:mon-test@127.0.0.1:5432/mon_test
      MON_TEST_DATABASE_URL: postgresql+psycopg://mon:mon-test@127.0.0.1:5432/mon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: Create non-bypass application database role
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://mon:mon-test@127.0.0.1:5432/mon_test"
          ) as connection:
              connection.execute(
                  "CREATE ROLE mon_app_ci LOGIN PASSWORD 'mon-app-ci-test' "
                  "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
              connection.execute("GRANT CONNECT ON DATABASE mon_test TO mon_app_ci")
              connection.execute("GRANT USAGE ON SCHEMA public TO mon_app_ci")
              connection.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO mon_app_ci"
              )
              connection.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO mon_app_ci"
              )
          PY
          echo "MON_TEST_DATABASE_URL=postgresql+psycopg://mon_app_ci:mon-app-ci-test@127.0.0.1:5432/mon_test" >> "$GITHUB_ENV"
      - name: PostgreSQL integration tests
        run: pytest -q tests/test_postgres_integration.py

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: console/package.json
      - name: Install console dependencies
        run: npm install --no-audit --no-fund
      - name: Test console
        run: npm test
      - name: Build console
        run: npm run build

  windows-endpoint-collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install "pyinstaller>=6.10,<7"
      - name: Windows collector tests
        run: pytest -q tests/test_windows_endpoint_collector.py
      - name: Collector CLI smoke
        run: mon-windows-endpoint-collector --help
      - name: Service host import and foreground runtime smoke
        run: |
          mon-windows-endpoint-collector foreground --help
          python -c "from mon.windows_endpoint_collector import NativeWindowsServiceControlBoundary, WindowsCollectorServiceRuntime; NativeWindowsServiceControlBoundary(); assert WindowsCollectorServiceRuntime"
      - name: Disposable SCM lifecycle validation
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name MONWindows `
            --collect-all mon `
            -c src/mon/windows_endpoint_collector.py
          $serviceName = "MONWindowsCI-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $stateDir = Join-Path $env:RUNNER_TEMP $serviceName
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $exe = (Resolve-Path ".\dist\MONWindows.exe").Path
          try {
            tools\windows\mon-windows-service.ps1 install -ServiceName $serviceName -ExecutablePath $exe -StateDir $stateDir -TenantId ci-tenant -SiteId ci-site -SensorId ci-sensor -SiteUrl http://127.0.0.1:9 -PollIntervalSeconds 1 -TimeoutSeconds 30
            tools\windows\mon-windows-service.ps1 start -ServiceName $serviceName -TimeoutSeconds 30
            tools\windows\mon-windows-service.ps1 status -ServiceName $serviceName
            tools\windows\mon-windows-service.ps1 stop -ServiceName $serviceName -TimeoutSeconds 30
          }
          finally {
            tools\windows\mon-windows-service.ps1 uninstall -ServiceName $serviceName -TimeoutSeconds 30
          }

  linux-enforcement-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MON and nftables tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables
      - name: Validate disposable nftables adapter
        run: |
          set -euo pipefail
          NS="mon-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PYTHON="$(command -v python)"
          cleanup() {
            sudo ip netns del "$NS" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo ip netns add "$NS"
          sudo ip netns exec "$NS" ip link set lo up
          sudo -E env \
            MON_ENABLE_DISPOSABLE_NETNS_ENFORCEMENT=1 \
            MON_TEST_NETNS="$NS" \
            "$PYTHON" -m pytest -q tests/test_nftables_netns_integration.py
