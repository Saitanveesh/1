name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -t mon-control-plane:test .

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mon_test
          POSTGRES_USER: mon
          POSTGRES_PASSWORD: mon-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mon -d mon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MON_DATABASE_URL: postgresql+psycopg://mon:mon-test@127.0.0.1:5432/mon_test
      MON_TEST_DATABASE_URL: postgresql+psycopg://mon:mon-test@127.0.0.1:5432/mon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: PostgreSQL integration tests
        run: pytest -q tests/test_postgres_integration.py

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: console/package.json
      - name: Install console dependencies
        run: npm install --no-audit --no-fund
      - name: Test console
        run: npm test
      - name: Build console
        run: npm run build
