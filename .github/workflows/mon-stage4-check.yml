name: MON Stage 4 - containment and victim evidence

on:
  push:
    branches:
      - 'feature/mon-stage4-*'
      - 'release/mon-batch4-rc1'
  pull_request:
    paths:
      - 'tools/mon_stage4_*.py'
      - 'tools/test_mon_stage4.py'
      - 'lab/pc5-training-site/**'
      - 'console/**'
      - '.github/workflows/mon-stage4-check.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --run
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m compileall -q tools/mon_stage4_gate.py tools/mon_stage4_bridge.py tools/mon-lab-portal.py lab/pc5-training-site/server.py lab/pc5-training-site/mon_stage4_impact.py
      - run: PYTHONPATH=tools python3 -m unittest discover -s tools -p test_mon_stage4.py -v
      - run: python3 -m unittest discover -s lab/pc5-training-site -p 'test_*.py' -v
      - run: bash -n tools/mon-stage4-pc2.sh lab/pc5-training-site/stage4-upgrade-pc5.sh
      - name: Validate exact isolated deployment archive
        run: |
          stage="$(mktemp -d)"
          git archive HEAD console tools/mon-lab-portal.py \
            tools/mon_stage4_gate.py tools/mon_stage4_bridge.py tools/mon_alert_ack.py \
            tools/test_mon_stage4.py lab/pc5-training-site | tar -xf - -C "$stage"
          (
            cd "$stage"
            PYTHONPATH="$stage/tools" python3 -m unittest discover -s tools -p test_mon_stage4.py -v
            python3 -m unittest discover -s lab/pc5-training-site -p 'test_site.py' -v
            python3 -m unittest discover -s lab/pc5-training-site -p 'test_impact.py' -v
          )
          rm -rf "$stage"

