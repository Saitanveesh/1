name: MON Batch 1 frontend validation
on:
  push:
    branches:
      - feature/mon-batch1-live-security-alert-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --run

  portal-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n tools/mon-batch1-fix-pc2.sh
      - run: python -m py_compile tools/mon-lab-portal.py lab/pc5-training-site/server.py
      - run: python -m unittest discover -s lab/pc5-training-site -p "test_*.py"
