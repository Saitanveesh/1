name: verify-release-candidate

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run ID that uploaded the release-candidate artifact
        required: true
      artifact_name:
        description: Release-candidate artifact name to download
        required: true
      expected_source_sha:
        description: Immutable source commit SHA expected in manifest and provenance
        required: true

permissions:
  actions: read
  contents: read

jobs:
  verify-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MON verifier
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip check

      - name: Download existing release-candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p candidate-download
          gh run download "$RUN_ID" \
            --repo Saitanveesh/1 \
            --name "$ARTIFACT_NAME" \
            --dir candidate-download

      - name: Verify release-candidate bytes, SBOMs, manifest, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          mon-release-verify candidate-download \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --online-attestations \
            --repo Saitanveesh/1 \
            --signer-workflow github.com/Saitanveesh/1/.github/workflows/release-candidate.yml

