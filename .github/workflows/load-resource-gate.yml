name: load-resource-gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mon/**"
      - "tools/load_resource_gate.py"
      - "tools/resource_sample.py"
      - "tools/fabric_load_probe.py"
      - ".github/workflows/load-resource-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-resource-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mon_load
          POSTGRES_USER: mon
          POSTGRES_PASSWORD: mon-load-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mon -d mon_load"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MON_ADMIN_DATABASE_URL: postgresql+psycopg://mon:mon-load-test@127.0.0.1:5432/mon_load
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MON
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply schema and create non-bypass application role
        env:
          MON_DATABASE_URL: ${{ env.MON_ADMIN_DATABASE_URL }}
        run: |
          alembic upgrade head
          python - <<'PY'
          import psycopg

          with psycopg.connect("postgresql://mon:mon-load-test@127.0.0.1:5432/mon_load") as c:
              c.execute(
                  "CREATE ROLE mon_app_load LOGIN PASSWORD 'mon-app-load-test' "
                  "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
              c.execute("GRANT CONNECT ON DATABASE mon_load TO mon_app_load")
              c.execute("GRANT USAGE ON SCHEMA public TO mon_app_load")
              c.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO mon_app_load")
              c.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO mon_app_load")
          PY
          echo "MON_APP_DATABASE_URL=postgresql+psycopg://mon_app_load:mon-app-load-test@127.0.0.1:5432/mon_load" >> "$GITHUB_ENV"
      - name: Bounded load, resource and restart gate
        timeout-minutes: 10
        env:
          MON_DATABASE_URL: ${{ env.MON_APP_DATABASE_URL }}
        run: python tools/load_resource_gate.py
      - name: Upload measured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-resource-gate-report
          path: load-resource-gate-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Residual process check
        if: always()
        run: pkill -f "uvicorn mon.api:app" || true
