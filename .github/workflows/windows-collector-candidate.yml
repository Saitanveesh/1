name: windows-collector-candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mon/windows_endpoint_collector.py"
      - "tools/windows/mon-windows-service.ps1"
      - "pyproject.toml"
      - ".github/workflows/windows-collector-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build inputs
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyinstaller>=6.10,<7"
          pip check
      - name: Build unsigned collector candidate
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name MONWindows `
            --collect-all mon `
            -c src/mon/windows_endpoint_collector.py
      - name: Validate candidate only in disposable CI
        shell: pwsh
        run: |
          .\dist\MONWindows.exe --help
      - name: Record exact candidate digest
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\MONWindows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MONWindows.exe" | Set-Content -Encoding ascii .\dist\MONWindows.exe.sha256
      - name: Upload unsigned CI candidate
        uses: actions/upload-artifact@v4
        with:
          name: mon-windows-collector-unsigned-${{ github.sha }}
          path: |
            dist/MONWindows.exe
            dist/MONWindows.exe.sha256
          if-no-files-found: error
          retention-days: 7
