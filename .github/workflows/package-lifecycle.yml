name: package-lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - "tools/package/**"
      - "tools/systemd/**"
      - "tools/windows/**"
      - "src/mon/windows_endpoint_collector.py"
      - "src/mon/linux_endpoint_collector.py"
      - "tests/test_package_lifecycle_windows.py"
      - "tests/test_package_lifecycle_linux.py"
      - ".github/workflows/package-lifecycle.yml"
      - "docs/adr/0072-deployable-packages-release-chain.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi-lifecycle:
    # Disposable GitHub-hosted Windows VM only: installs a real MONWindows service.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build inputs and WiX
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' "pyinstaller>=6.10,<7"
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build collector candidates A and B (unsigned)
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name MONWindows `
            --collect-all mon -c src/mon/windows_endpoint_collector.py
          "package lifecycle upgrade candidate" | Set-Content -Encoding ascii .\upgrade-marker.txt
          pyinstaller --clean --noconfirm --onefile --name MONWindows `
            --distpath .\dist-b --workpath .\build-b --specpath .\build-b `
            --collect-all mon --add-data "$PWD\upgrade-marker.txt;." `
            -c src/mon/windows_endpoint_collector.py
      - name: Build MSI A (1.0.0) and MSI B (1.0.1)
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          .\tools\package\build_msi.ps1 -Exe .\dist\MONWindows.exe -Version 1.0.0 -Out .\msi\MONWindows-1.0.0.msi
          .\tools\package\build_msi.ps1 -Exe .\dist-b\MONWindows.exe -Version 1.0.1 -Out .\msi\MONWindows-1.0.1.msi
      - name: MSI lifecycle certification
        timeout-minutes: 15
        shell: pwsh
        env:
          MON_PKG_WIN: "1"
        run: |
          $env:MON_PKG_MSI_A = (Resolve-Path .\msi\MONWindows-1.0.0.msi).Path
          $env:MON_PKG_MSI_B = (Resolve-Path .\msi\MONWindows-1.0.1.msi).Path
          $env:MON_PKG_EXE_A = (Resolve-Path .\dist\MONWindows.exe).Path
          $env:MON_PKG_EXE_B = (Resolve-Path .\dist-b\MONWindows.exe).Path
          pytest -q -rs tests/test_package_lifecycle_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Final cleanup and residue check
        if: always()
        shell: pwsh
        run: |
          if (Get-Service MONWindows -ErrorAction SilentlyContinue) {
            sc.exe stop MONWindows | Out-Null
            sc.exe delete MONWindows | Out-Null
          }
          Get-Process -Name MONWindows -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Get-Service MONWindows -ErrorAction SilentlyContinue) { throw "residual MONWindows service" }
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-lifecycle-report
          path: windows-package-lifecycle-report.json
          if-no-files-found: warn
          retention-days: 30

  linux-deb-lifecycle:
    # Disposable GitHub-hosted Ubuntu VM (systemd is PID 1): installs a real package.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build inputs
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' "pyinstaller>=6.10,<7"
      - name: Build collector candidates A and B (unsigned)
        run: |
          pyinstaller --clean --noconfirm --onefile --name mon-linux-endpoint-collector \
            --collect-all mon src/mon/linux_endpoint_collector.py
          echo "package lifecycle upgrade candidate" > upgrade-marker.txt
          pyinstaller --clean --noconfirm --onefile --name mon-linux-endpoint-collector \
            --distpath dist-b --workpath build-b --specpath build-b \
            --collect-all mon --add-data "$PWD/upgrade-marker.txt:." \
            src/mon/linux_endpoint_collector.py
      - name: Build .deb A (0.1.0) and .deb B (0.1.1)
        run: |
          sh tools/package/build_deb.sh dist/mon-linux-endpoint-collector 0.1.0 debs
          sh tools/package/build_deb.sh dist-b/mon-linux-endpoint-collector 0.1.1 debs
          ls -l debs
      - name: Deb lifecycle certification
        timeout-minutes: 15
        run: |
          sudo -E env PATH="$PATH" \
            MON_PKG_LINUX=1 \
            MON_PKG_DEB_A="$PWD/debs/mon-linux-endpoint-collector_0.1.0_amd64.deb" \
            MON_PKG_DEB_B="$PWD/debs/mon-linux-endpoint-collector_0.1.1_amd64.deb" \
            MON_PKG_BIN_A="$PWD/dist/mon-linux-endpoint-collector" \
            MON_PKG_BIN_B="$PWD/dist-b/mon-linux-endpoint-collector" \
            "$(command -v python)" -m pytest -q -rs tests/test_package_lifecycle_linux.py
      - name: Final cleanup and residue check
        if: always()
        run: |
          sudo systemctl stop mon-linux-endpoint-collector 2>/dev/null || true
          sudo dpkg -P mon-linux-endpoint-collector 2>/dev/null || true
          ! dpkg -s mon-linux-endpoint-collector 2>/dev/null
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-lifecycle-report
          path: linux-package-lifecycle-report.json
          if-no-files-found: warn
          retention-days: 30
