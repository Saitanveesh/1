name: control-plane-ha

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mon/**"
      - "tests/test_control_plane_ha.py"
      - ".github/workflows/control-plane-ha.yml"
      - "docs/adr/0070-control-plane-ha-failover-certification.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mon_ha
          POSTGRES_USER: mon
          POSTGRES_PASSWORD: mon-ha-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mon -d mon_ha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MON_ADMIN_DATABASE_URL: postgresql+psycopg://mon:mon-ha-test@127.0.0.1:5432/mon_ha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MON and nginx (test-only reverse proxy)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo systemctl stop nginx || true
      - name: Apply schema once (both instances share it)
        env:
          MON_DATABASE_URL: ${{ env.MON_ADMIN_DATABASE_URL }}
        run: alembic upgrade head
      - name: Create non-bypass application role
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect("postgresql://mon:mon-ha-test@127.0.0.1:5432/mon_ha") as c:
              c.execute(
                  "CREATE ROLE mon_app_ha LOGIN PASSWORD 'mon-app-ha-test' "
                  "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
              c.execute("GRANT CONNECT ON DATABASE mon_ha TO mon_app_ha")
              c.execute("GRANT USAGE ON SCHEMA public TO mon_app_ha")
              c.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO mon_app_ha"
              )
              c.execute(
                  "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO mon_app_ha"
              )
          PY
          echo "MON_TEST_DATABASE_URL=postgresql+psycopg://mon_app_ha:mon-app-ha-test@127.0.0.1:5432/mon_ha" >> "$GITHUB_ENV"
      - name: Run HA / failover certification
        timeout-minutes: 12
        env:
          MON_HA_CERT: "1"
          MON_TEST_ADMIN_DATABASE_URL: ${{ env.MON_ADMIN_DATABASE_URL }}
        run: pytest -q -rs tests/test_control_plane_ha.py
      - name: Upload HA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-ha-report
          path: control-plane-ha-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Residual process check
        if: always()
        run: |
          pkill -f "uvicorn mon.api:app" || true
          pkill nginx || true
