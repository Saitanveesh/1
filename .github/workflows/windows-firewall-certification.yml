name: windows-firewall-certification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mon/connectors/windows_firewall_endpoint.py"
      - "src/mon/enforcement.py"
      - "src/mon/enforcement_certification.py"
      - "tests/test_windows_firewall_endpoint_adapter.py"
      - "tests/test_windows_firewall_certification.py"
      - ".github/workflows/windows-firewall-certification.yml"
      - "docs/adr/0071-windows-defender-firewall-enforcement.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-firewall-certification:
    # Disposable GitHub-hosted Windows VM only. Creates rules only inside the
    # MON-owned "MON Endpoint Containment" group with documentation addresses.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Adapter unit tests
        shell: pwsh
        run: pytest -q tests/test_windows_firewall_endpoint_adapter.py
      - name: Record firewall baseline
        shell: powershell
        run: |
          Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultInboundAction -AutoSize
          (Get-NetFirewallRule).Count
      - name: Windows Defender Firewall certification
        timeout-minutes: 12
        shell: pwsh
        env:
          MON_WINDOWS_FW_CERT: "1"
          MON_ENABLE_WINDOWS_FIREWALL_ENFORCEMENT: "1"
        run: |
          pytest -q -rs tests/test_windows_firewall_certification.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Final cleanup and residue check
        if: always()
        shell: powershell
        run: |
          Get-NetFirewallRule -Group 'MON Endpoint Containment' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'mon:v1:cert:*' -or $_.Name -like 'mon-cert-*' } |
            Remove-NetFirewallRule
          Get-NetFirewallRule -Name 'mon-cert-operator-*' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          $left = @(Get-NetFirewallRule -Name 'mon-cert-*' -ErrorAction SilentlyContinue)
          if ($left.Count -gt 0) { throw "residual certification firewall rule present" }
      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-firewall-certification-report
          path: windows-firewall-certification-report.json
          if-no-files-found: warn
          retention-days: 30
