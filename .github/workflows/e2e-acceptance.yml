name: e2e-acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mon/**"
      - "tests/test_e2e_acceptance.py"
      - ".github/workflows/e2e-acceptance.yml"
      - "docs/adr/0066-end-to-end-acceptance-gate.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-acceptance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mon_e2e
          POSTGRES_USER: mon
          POSTGRES_PASSWORD: mon-e2e-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mon -d mon_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MON_TEST_DATABASE_URL: postgresql+psycopg://mon:mon-e2e-test@127.0.0.1:5432/mon_e2e
      MON_DATABASE_URL: postgresql+psycopg://mon:mon-e2e-test@127.0.0.1:5432/mon_e2e
      PGPASSWORD: mon-e2e-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MON and disposable-namespace tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables postgresql-client
      - name: Apply control-plane schema migrations
        run: alembic upgrade head
      - name: Run end-to-end acceptance gate in a disposable network namespace
        timeout-minutes: 15
        run: |
          set -euo pipefail
          NS="mon-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PYTHON="$(command -v python)"
          cleanup() {
            sudo ip netns del "$NS" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo ip netns add "$NS"
          sudo ip netns exec "$NS" ip link set lo up
          # The acceptance gate's containment step exercises `ip netns exec`
          # directly, which needs elevated privileges; the whole process runs
          # under sudo, never the runner's own host firewall/namespace.
          sudo -E env \
            PATH="$PATH" \
            MON_TEST_DATABASE_URL="$MON_TEST_DATABASE_URL" \
            MON_DATABASE_URL="$MON_DATABASE_URL" \
            MON_ENABLE_ENDPOINT_NFTABLES_ENFORCEMENT=1 \
            MON_TEST_NETNS="$NS" \
            "$PYTHON" -m pytest -q tests/test_e2e_acceptance.py
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-acceptance-report
          path: e2e-acceptance-report.json
          if-no-files-found: warn
          retention-days: 30
